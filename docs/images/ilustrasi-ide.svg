<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
  </defs>

  <!-- latar -->
  <rect width="960" height="640" rx="16" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Secure Battery Identity Chip</text>
  <text x="480" y="66" text-anchor="middle" font-size="14" fill="#475569">Baterai asli diterima, baterai palsu ditolak, data riwayat tidak bisa dimanipulasi</text>

  <!-- ===== Kolom kiri: pack baterai ===== -->
  <rect x="30" y="90" width="270" height="270" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="165" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Pack Baterai Motor Listrik</text>
  <!-- ikon baterai -->
  <rect x="50" y="134" width="56" height="96" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="66" y="126" width="24" height="8" rx="2" fill="#16a34a"/>
  <rect x="58" y="190" width="40" height="32" rx="3" fill="#86efac"/>
  <rect x="58" y="154" width="40" height="30" rx="3" fill="#bbf7d0"/>
  <!-- chip secure element -->
  <rect x="122" y="130" width="164" height="142" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="204" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Secure Element (chip kita)</text>
  <text x="134" y="176" font-size="12" fill="#0f172a">• RO-PUF: sidik jari unik,</text>
  <text x="146" y="192" font-size="12" fill="#0f172a">kunci tidak disimpan</text>
  <text x="134" y="212" font-size="12" fill="#0f172a">• HMAC-SHA-256</text>
  <text x="134" y="232" font-size="12" fill="#0f172a">• Detektor glitch</text>
  <text x="146" y="248" font-size="12" fill="#0f172a">+ hapus kunci (zeroize)</text>
  <!-- pin chip -->
  <g stroke="#0f172a" stroke-width="2">
    <line x1="150" y1="272" x2="150" y2="280"/><line x1="180" y1="272" x2="180" y2="280"/>
    <line x1="210" y1="272" x2="210" y2="280"/><line x1="240" y1="272" x2="240" y2="280"/>
    <line x1="150" y1="122" x2="150" y2="130"/><line x1="180" y1="122" x2="180" y2="130"/>
    <line x1="210" y1="122" x2="210" y2="130"/><line x1="240" y1="122" x2="240" y2="130"/>
  </g>
  <!-- BMS -->
  <rect x="50" y="296" width="236" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="168" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">BMS</text>
  <text x="168" y="334" text-anchor="middle" font-size="12" fill="#166534">menyimpan log siklus &amp; kesehatan</text>

  <!-- ===== Kolom tengah: SPBKLU ===== -->
  <rect x="370" y="90" width="220" height="270" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="480" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">SPBKLU</text>
  <text x="480" y="134" text-anchor="middle" font-size="12" fill="#475569">stasiun tukar baterai (verifier)</text>
  <!-- ikon stasiun -->
  <rect x="440" y="150" width="80" height="110" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <rect x="452" y="162" width="56" height="34" rx="4" fill="#ffffff" stroke="#334155"/>
  <text x="480" y="184" text-anchor="middle" font-size="18" fill="#16a34a">✔</text>
  <rect x="452" y="206" width="56" height="14" rx="3" fill="#cbd5e1"/>
  <rect x="452" y="226" width="56" height="14" rx="3" fill="#cbd5e1"/>
  <!-- hasil -->
  <rect x="392" y="282" width="176" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Respons cocok</text>
  <text x="480" y="323" text-anchor="middle" font-size="12" fill="#166534">baterai asli, boleh dipakai</text>

  <!-- ===== Kolom kanan: pihak tepercaya ===== -->
  <rect x="660" y="90" width="270" height="270" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="795" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Pihak Tepercaya</text>
  <text x="795" y="134" text-anchor="middle" font-size="12" fill="#4338ca">lembaga penjamin keaslian</text>
  <!-- ikon database -->
  <g fill="#c7d2fe" stroke="#4338ca" stroke-width="2">
    <path d="M755,160 v70 a40,12 0 0 0 80,0 v-70"/>
    <ellipse cx="795" cy="160" rx="40" ry="12"/>
    <path d="M755,183 a40,12 0 0 0 80,0" fill="none"/>
    <path d="M755,206 a40,12 0 0 0 80,0" fill="none"/>
  </g>
  <text x="795" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Registri identitas chip</text>
  <text x="795" y="288" text-anchor="middle" font-size="12" fill="#3730a3">setiap chip didaftarkan</text>
  <text x="795" y="304" text-anchor="middle" font-size="12" fill="#3730a3">saat produksi baterai,</text>
  <text x="795" y="320" text-anchor="middle" font-size="12" fill="#3730a3">seperti penerbitan dokumen</text>
  <text x="795" y="336" text-anchor="middle" font-size="12" fill="#3730a3">identitas &amp; sertifikat</text>

  <!-- ===== Panah alur ===== -->
  <!-- 1: challenge -->
  <line x1="368" y1="170" x2="302" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="335" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">① nonce</text>
  <!-- 2: response -->
  <line x1="302" y1="226" x2="368" y2="226" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="335" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">② respons</text>
  <text x="335" y="246" text-anchor="middle" font-size="11" fill="#475569">+ log</text>
  <text x="335" y="260" text-anchor="middle" font-size="11" fill="#475569">bertanda</text>
  <text x="335" y="274" text-anchor="middle" font-size="11" fill="#475569">tangan</text>
  <!-- 3: cek ke registri -->
  <line x1="592" y1="196" x2="658" y2="196" stroke="#4338ca" stroke-width="2" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
  <text x="625" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">③ cek</text>
  <text x="625" y="216" text-anchor="middle" font-size="11" fill="#4338ca">identitas</text>
  <!-- 0: enrolment -->
  <path d="M795,362 V392 H165 V362" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrP)"/>
  <rect x="245" y="380" width="470" height="24" rx="12" fill="#ffffff"/>
  <text x="480" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">⓪ Enrolment di pabrik: sidik jari PUF didaftarkan ke registri tepercaya</text>

  <!-- ===== Baris bawah: serangan ===== -->
  <text x="30" y="446" font-size="15" font-weight="700" fill="#0f172a">Serangan yang ditangkal</text>

  <rect x="30" y="460" width="286" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="50" y="490" font-size="14" font-weight="700" fill="#991b1b">✖ Baterai palsu / kloningan</text>
  <text x="50" y="516" font-size="12" fill="#7f1d1d">Rangkaian bisa disalin, tapi sidik</text>
  <text x="50" y="533" font-size="12" fill="#7f1d1d">jari PUF tidak. Respons salah,</text>
  <text x="50" y="550" font-size="12" fill="#7f1d1d">stasiun menolak baterai.</text>
  <text x="50" y="590" font-size="12" font-weight="700" fill="#991b1b">→ DITOLAK</text>

  <rect x="337" y="460" width="286" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="357" y="490" font-size="14" font-weight="700" fill="#991b1b">✖ Riwayat baterai dimanipulasi</text>
  <text x="357" y="516" font-size="12" fill="#7f1d1d">Jumlah siklus di-reset agar baterai</text>
  <text x="357" y="533" font-size="12" fill="#7f1d1d">tua terlihat baru. Tanda tangan</text>
  <text x="357" y="550" font-size="12" fill="#7f1d1d">tidak cocok lagi dengan isi log.</text>
  <text x="357" y="590" font-size="12" font-weight="700" fill="#991b1b">→ DITOLAK</text>

  <rect x="644" y="460" width="286" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="664" y="490" font-size="14" font-weight="700" fill="#991b1b">✖ Serangan glitch / bongkar</text>
  <text x="664" y="516" font-size="12" fill="#7f1d1d">Tegangan atau clock diganggu</text>
  <text x="664" y="533" font-size="12" fill="#7f1d1d">untuk mencuri kunci. Detektor</text>
  <text x="664" y="550" font-size="12" fill="#7f1d1d">memicu penghapusan kunci.</text>
  <text x="664" y="590" font-size="12" font-weight="700" fill="#991b1b">→ CHIP TERKUNCI</text>
</svg>
